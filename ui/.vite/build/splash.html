<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('./fonts/Orbitron-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeInScale 0.6s ease-out;
    }
    .logo {
      width: 48px;
      height: 48px;
      position: relative;
    }
    .logo::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 100%);
      animation: glowSweep 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    .logo-icon {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.4));
    }
    h1 {
      font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: #4A90E2;
      letter-spacing: 0.1em;
      margin: 0;
      position: relative;
      animation: fadeIn 0.8s ease-out 0.2s both;
      filter: drop-shadow(0 0 8px rgba(74, 144, 226, 0.4));
    }
    h1::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 100%);
      animation: glowSweep 3s ease-in-out infinite 0.4s;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    @keyframes glowSweep {
      0% {
        left: -100%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <img src="focus.png" alt="Focus" class="logo-icon">
    </div>
    <h1>Focus</h1>
  </div>
</body>
</html>
