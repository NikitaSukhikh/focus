name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-tag:
    name: Verify Git Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
      commit_sha: ${{ steps.get_commit.outputs.commit_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: get_tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Get commit SHA
        id: get_commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Verify tag points to commit
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ steps.get_tag.outputs.tag_name }})
          if [ "$TAG_COMMIT" != "${{ steps.get_commit.outputs.commit_sha }}" ]; then
            echo "ERROR: Tag does not point to checked out commit"
            exit 1
          fi
          echo "✓ Tag ${{ steps.get_tag.outputs.tag_name }} verified for commit ${{ steps.get_commit.outputs.commit_sha }}"

  build-backend:
    name: Build Backend Binary
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Pandoc (required by pypandoc)
        run: choco install pandoc -y

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Build backend with PyInstaller
        working-directory: backend
        run: uv run pyinstaller focus.spec

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-${{ needs.verify-tag.outputs.tag_name }}
          path: backend/dist/Focus
          retention-days: 7

  build-backend-macos:
    name: Build Backend Binary (macOS)
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Pandoc (required by pypandoc)
        run: brew install pandoc

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Build backend with PyInstaller
        working-directory: backend
        run: uv run pyinstaller focus.spec

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-macos-${{ needs.verify-tag.outputs.tag_name }}
          path: backend/dist/Focus
          retention-days: 7

  build-windows:
    name: Build Windows Release
    needs: [verify-tag, build-backend]
    runs-on: windows-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Derive release version
        shell: pwsh
        run: |
          $version = "${{ needs.verify-tag.outputs.tag_name }}".TrimStart("v")
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary-${{ needs.verify-tag.outputs.tag_name }}
          path: ui/resources

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Electron app
        working-directory: ui
        run: npm run build
        env:
          # Add Windows code signing if certificates are available
          WINDOWS_PFX_PATH: ${{ secrets.WINDOWS_PFX_PATH }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_SIGN_PARAMS: ${{ secrets.WINDOWS_SIGN_PARAMS }}

      - name: Build Inno Setup installer
        run: |
          choco install innosetup -y
          $isccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6\iscc.exe",
            "C:\Program Files\Inno Setup 6\iscc.exe"
          )
          $iscc = $isccPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler (iscc.exe) not found"
          }
          & $iscc "/DAppVersion=$env:RELEASE_VERSION" "installer\focus.iss"

      - name: Generate SHA256 checksums
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path "dist" -File -Filter *.exe -ErrorAction SilentlyContinue
          $artifacts += Get-ChildItem -Path "ui/out/make" -Recurse -File -Filter *.zip -ErrorAction SilentlyContinue

          if ($artifacts.Count -eq 0) {
            throw "No Windows release artifacts found for checksum generation"
          }

          $checksumFile = "ui/out/make/checksums.txt"
          if (Test-Path $checksumFile) {
            Remove-Item $checksumFile -Force
          }

          $artifacts | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash)  $($_.Name)" | Out-File -Append -FilePath $checksumFile
          }
          Get-Content $checksumFile

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ needs.verify-tag.outputs.tag_name }}
          path: |
            dist/*.exe
            ui/out/make/**/*.zip
            ui/out/make/checksums.txt
          retention-days: 30

  build-macos:
    name: Build macOS Release
    needs: [verify-tag, build-backend-macos]
    runs-on: macos-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-binary-macos-${{ needs.verify-tag.outputs.tag_name }}
          path: ui/resources

      - name: Make backend executable
        run: chmod +x ui/resources/Focus/Focus

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build Electron app
        working-directory: ui
        run: npm run build

      - name: Generate SHA256 checksums
        working-directory: ui/out/make
        run: |
          find . -type f \( -name "*.dmg" -o -name "*.zip" \) -print0 | xargs -0 shasum -a 256 >> checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ needs.verify-tag.outputs.tag_name }}
          path: |
            ui/out/make/**/*.dmg
            ui/out/make/**/*.zip
            ui/out/make/checksums-macos.txt
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [verify-tag, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer-${{ needs.verify-tag.outputs.tag_name }}
          path: artifacts/windows

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-${{ needs.verify-tag.outputs.tag_name }}
          path: artifacts/macos

      - name: Create Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Release ${{ needs.verify-tag.outputs.tag_name }}

          **Commit:** ${{ needs.verify-tag.outputs.commit_sha }}
          **Built:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### Verification
          This release was built from tagged commit ${{ needs.verify-tag.outputs.commit_sha }}.

          To verify the build:
          ```bash
          git verify-tag ${{ needs.verify-tag.outputs.tag_name }}
          git checkout ${{ needs.verify-tag.outputs.tag_name }}
          ```

          ### Checksums
          See platform-specific checksum files in the release assets:
          - Windows: `checksums.txt`
          - macOS: `checksums-macos.txt`
          EOF
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.verify-tag.outputs.tag_name }}
          name: Focus ${{ needs.verify-tag.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/windows/**/*
            artifacts/macos/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
