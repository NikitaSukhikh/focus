[project]
name = "focus-assist-backend"
version = "0.1.0"
description = "AI assistant backend for the Focus desktop application"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.20",
    # LLM
    "llama-cpp-python>=0.2.60",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # File Processing
    "pypdf>=4.0.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
    # Email
    "aiosmtplib>=3.0.0",
    "aioimaplib>=1.0.0",
    # HTTP Clients / External APIs
    "httpx>=0.27.0",
    "anthropic>=0.21.0",
    "openai>=1.14.0",
    # Calendar & Google Drive
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.120.0",
    # Telegram
    "python-telegram-bot>=21.0",
    # Activity Monitoring (Windows)
    "pywin32>=306; sys_platform == 'win32'",
    # Utilities
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
package = false
