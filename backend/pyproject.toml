[project]
name = "focus-backend"
version = "0.1.0"
description = "FastAPI backend for the Focus desktop application"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    # Web framework & ASGI
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.18",
    # Validation/config
    "pydantic==2.10.5",
    "pydantic-settings==2.7.0",
    # Data & storage
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    # HTTP & logging
    "httpx==0.28.1",
    "python-json-logger==3.2.1",
    # Parsing & previews
    "beautifulsoup4==4.12.3",
    "chardet==5.2.0",
    "Pillow==11.1.0",
    "pillow-heif==0.20.0",
    "python-docx==1.1.2",
    "pypandoc==1.14",
    "pywin32==311; sys_platform == 'win32'",
    "mutagen==1.47.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "pandas==2.2.3",
    "ebooklib==0.20",
    "lxml==6.0.2",
    # Google integrations
    "google-auth==2.37.0",
    "google-auth-oauthlib==1.2.1",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.156.0",
    "googleapis-common-protos==1.66.0",
    # Env & security
    "python-dotenv==1.0.1",
    "cryptography>=44.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "flake8==7.1.1",
    "mypy==1.13.0",
    "pyinstaller",
]

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

# Third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "pythonjsonlogger.*",
    "chardet.*",
    "PIL.*",
    "pillow_heif.*",
    "docx.*",
    "pypandoc.*",
    "mutagen.*",
    "openpyxl.*",
    "xlrd.*",
    "pandas.*",
    "ebooklib.*",
    "lxml.*",
    "googleapiclient.*",
    "google.*",
    "cryptography.*",
]
ignore_missing_imports = true

[tool.uv]
package = false
